name: Message spam watch local evaluation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s skills/security/mithril-message-spam-watch/tests -p 'test_*.py'
      - run: python skills/security/mithril-message-spam-watch/scripts/acceptance.py
      - run: python scripts/build_index.py --check
